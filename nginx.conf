server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre (los que genera Vite): cachear agresivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback de SPA: cualquier ruta que no sea un archivo real cae en index.html
    location / {
        try_files $uri /index.html;
    }
}
